<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf8f2">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<title>My Diary</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500&display=swap');

:root{
  --paper:#faf8f2;
  --paper-alt-1:#f6f4ed;
  --paper-alt-2:#f1f4ed;
  --ink:#514d46;
  --muted:#9a9388;
  --line:#ded8cc;
  --sage:#aeb7a5;
  --page-bg:#e7e2d9;

  --priority-high:#c77f73;
  --priority-medium:#d4ad70;
  --priority-low:#8faa8f;
  --priority-none:#c8c1b8;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--page-bg);
  color:var(--ink);
  font-family:"DM Sans",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

.app{
  max-width:1400px;
  margin:auto;
  padding:28px;
}

/* TOP HEADER */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:30;
  background:var(--page-bg);
  padding:14px 0 8px;
}

.brand{
  font-family:"Cormorant Garamond",serif;
  font-size:42px;
  font-style:italic;
}

.nav{
  display:flex;
  gap:8px;
  align-items:center;
}

button{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:white;
}

/* MAIN APP TABS */

.tabs{
  display:flex;
  gap:8px;
  position:sticky;
  top:70px;
  z-index:29;
  background:var(--page-bg);
  padding:4px 0 10px;
  border-bottom:1px solid rgba(222,216,204,.75);
}

.tabButton{
  border:0;
  background:transparent;
  border-radius:0;
  padding:8px 4px 7px;
  margin-right:16px;
  color:var(--muted);
  font-size:13px;
  letter-spacing:.5px;
  border-bottom:2px solid transparent;
}

.tabButton:hover{
  background:transparent;
  color:var(--ink);
}

.tabButton.active{
  color:var(--ink);
  border-bottom-color:var(--sage);
}

.tabPanel{
  display:none;
}

.tabPanel.active{
  display:block;
}

/* BACKUP BAR */

.settings{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin:14px 0 12px;
}

.settings span{
  font-size:12px;
  color:var(--muted);
}

#importFile{
  display:none;
}

/* MONTH TITLE */

.monthTitle{
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  position:sticky;
  top:111px;
  z-index:28;
  background:var(--page-bg);
  margin:0;
  padding:8px 0 10px;
}

/* MONDAY-FRIDAY COLUMN HEADINGS */

.weekdays{
  display:grid;
  grid-template-columns:repeat(5,minmax(190px,1fr));
  gap:14px;
  min-width:1000px;
  padding:8px 0 10px;
  background:var(--page-bg);
}

.weekday{
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:19px;
  font-style:italic;
  color:var(--muted);
}

.plannerScroll{
  overflow-x:auto;
  overflow-y:visible;
  padding-bottom:6px;
}

/* FIVE-DAY WORK WEEK GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(190px,1fr));
  grid-auto-rows:minmax(250px,auto);
  gap:14px;
  min-width:1000px;
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  padding:18px;
  min-height:250px;
  position:relative;
  box-shadow:0 2px 8px #00000008;
  scroll-margin-top:195px;
}

.card.alt1{
  background:var(--paper-alt-1);
}

.card.alt2{
  background:var(--paper-alt-2);
}

/* TODAY */

.today{
  border:2px solid var(--sage);
  box-shadow:0 5px 18px #00000012;
}

.today::before{
  content:"today";
  position:absolute;
  top:-10px;
  left:14px;
  background:var(--sage);
  color:white;
  font-size:9px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  padding:3px 7px;
  border-radius:10px;
}

/* DAY CARDS */

.dayhead{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:1px solid var(--line);
  padding-bottom:9px;
  margin-bottom:12px;
}

.day{
  font-family:"Cormorant Garamond",serif;
  font-style:italic;
  font-size:25px;
}

.date{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  color:var(--muted);
}

.tasks{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.task{
  display:flex;
  gap:8px;
  align-items:flex-start;
}

.task input[type=checkbox],
.generalTask input[type=checkbox]{
  appearance:none;
  width:16px;
  height:16px;
  border:1px solid #aaa398;
  background:transparent;
  border-radius:2px;
  cursor:pointer;
  flex:none;
  margin-top:5px;
}

.task input:checked,
.generalTask input:checked{
  background:var(--sage);
  border-color:var(--sage);
}

.task input:checked::after,
.generalTask input:checked::after{
  content:"✓";
  display:block;
  text-align:center;
  font-size:11px;
  color:white;
  line-height:15px;
}

.task input:checked + textarea,
.generalTask.completed textarea{
  text-decoration:line-through;
  color:var(--muted);
}

/* WRAPPING TASK TEXT */

.taskText{
  border:0;
  border-bottom:1px solid #ded8cc;
  background:transparent;
  outline:0;
  width:100%;
  min-width:0;
  min-height:26px;
  padding:3px 0 4px;
  color:var(--ink);
  resize:none;
  overflow:hidden;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.deleteTask{
  display:none;
}

.deleteTask:hover{
  background:transparent;
  color:#7f776d;
  opacity:1;
}

.calendarTask{
  display:none;
}

.calendarTask:hover{
  background:transparent;
  opacity:1;
}

.calendarIcon{
  display:inline-block;
  width:15px;
  height:14px;
  border:1.4px solid #8f9b88;
  border-radius:3px;
  position:relative;
  vertical-align:middle;
}

.calendarIcon::before{
  content:"";
  position:absolute;
  left:-1.4px;
  right:-1.4px;
  top:3px;
  border-top:1.4px solid #8f9b88;
}

.calendarIcon::after{
  content:"";
  position:absolute;
  width:7px;
  height:3px;
  left:3px;
  top:-3px;
  border-left:1.4px solid #8f9b88;
  border-right:1.4px solid #8f9b88;
}

.add{
  margin-top:12px;
  background:transparent;
  border:0;
  color:var(--muted);
  cursor:pointer;
  font-size:12px;
  padding-left:0;
}

.open{
  position:absolute;
  right:12px;
  bottom:10px;
  border:0;
  background:transparent;
  color:#aaa398;
  cursor:pointer;
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
  margin:20px;
}

/* GENERAL TO DO TAB */

.generalWrap{
  max-width:900px;
  margin:28px auto 0;
}

.generalHeader{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:18px;
}

.generalTitle{
  margin:0;
  font-family:"Cormorant Garamond",serif;
  font-weight:400;
  font-style:italic;
  font-size:42px;
}

.generalIntro{
  margin:4px 0 0;
  font-size:12px;
  color:var(--muted);
}

.generalAdd{
  display:flex;
  gap:8px;
  align-items:center;
  background:var(--paper);
  border:1px solid var(--line);
  padding:12px;
  border-radius:10px;
  margin-bottom:16px;
}

.generalAdd textarea{
  flex:1;
  border:0;
  background:transparent;
  outline:0;
  resize:none;
  overflow:hidden;
  min-height:28px;
  line-height:1.45;
  color:var(--ink);
}

.prioritySelect{
  border:1px solid var(--line);
  background:#fffdf8;
  color:var(--ink);
  border-radius:7px;
  padding:8px 9px;
  font-size:12px;
}

.addGeneralButton{
  white-space:nowrap;
}

.priorityLegend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin:4px 0 16px;
  font-size:11px;
  color:var(--muted);
}

.legendItem{
  display:flex;
  align-items:center;
  gap:6px;
}

.legendDot{
  width:9px;
  height:9px;
  border-radius:50%;
}

.generalList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.generalTask{
  display:grid;
  grid-template-columns:auto 6px minmax(0,1fr) auto auto;
  gap:10px;
  align-items:flex-start;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px 12px 12px 10px;
  box-shadow:0 2px 8px #00000007;
}

.priorityBar{
  width:6px;
  min-height:34px;
  height:100%;
  border-radius:5px;
  background:var(--priority-none);
}

.generalTask.priority-high .priorityBar{
  background:var(--priority-high);
}

.generalTask.priority-medium .priorityBar{
  background:var(--priority-medium);
}

.generalTask.priority-low .priorityBar{
  background:var(--priority-low);
}

.generalTask textarea{
  border:0;
  border-bottom:1px solid #e3ddd3;
  background:transparent;
  outline:0;
  resize:none;
  overflow:hidden;
  min-height:28px;
  width:100%;
  line-height:1.45;
  color:var(--ink);
}

.generalTask select{
  border:1px solid var(--line);
  background:#fffdf8;
  color:var(--ink);
  border-radius:7px;
  padding:6px 8px;
  font-size:11px;
}

.generalTask .deleteTask{
  margin-top:3px;
}

.emptyState{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:40px 20px;
  border:1px dashed var(--line);
  border-radius:10px;
  background:rgba(250,248,242,.45);
}


/* PRIORITY GROUPS */

.priorityGroup{
  margin-bottom:24px;
}

.priorityGroupHeader{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 10px;
  padding:0 2px 7px;
  border-bottom:1px solid var(--line);
  font-family:"Cormorant Garamond",serif;
  font-size:23px;
  font-style:italic;
  font-weight:400;
}

.priorityGroupDot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex:none;
}

.priorityGroupCount{
  margin-left:auto;
  font-family:"DM Sans",sans-serif;
  font-size:10px;
  font-style:normal;
  color:var(--muted);
  letter-spacing:.8px;
  text-transform:uppercase;
}

.priorityGroupList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.completedGroup{
  margin-top:30px;
  opacity:.78;
}



/* TASK RIGHT-CLICK / LONG-PRESS MENU */

.contextMenu{
  display:none;
  position:fixed;
  z-index:100;
  width:190px !important;
  min-width:190px !important;
  max-width:190px !important;
  height:auto !important;
  min-height:0 !important;
  max-height:none !important;
  overflow:visible !important;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:9px;
  padding:5px;
  box-shadow:0 10px 28px #0000001a;
}

.contextMenu.open{
  display:block !important;
}

.contextMenuTitle{
  display:block;
  width:auto;
  height:auto;
  min-height:0;
  padding:5px 8px 6px;
  margin:0 0 3px;
  font-family:"Cormorant Garamond",serif;
  font-size:15px;
  line-height:1.2;
  font-style:italic;
  color:var(--muted);
  border-bottom:1px solid var(--line);
}

#contextMenuActions{
  display:block;
  width:auto;
  height:auto;
  min-height:0;
}

.contextMenu button{
  display:block;
  width:100%;
  height:auto;
  min-height:0;
  margin:0;
  text-align:left;
  border:0;
  background:transparent;
  padding:6px 8px;
  border-radius:5px;
  font-size:11px;
  line-height:1.25;
}

.contextMenu button:hover{
  background:#f1eee6;
}

.contextDivider{
  display:block;
  width:auto;
  height:1px;
  min-height:1px;
  background:var(--line);
  margin:3px 5px;
}

.contextDelete{
  color:#9b655e !important;
}

.contextPriorityRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  width:auto;
  height:25px;
  min-height:25px;
  padding:3px 7px 4px;
}

.priorityChoice{
  display:block !important;
  width:100% !important;
  height:20px !important;
  min-height:20px !important;
  padding:0 !important;
  border:1px solid var(--line) !important;
  border-radius:5px !important;
  position:relative;
}

.priorityChoice::after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:var(--priority-none);
}

.priorityChoice[data-priority="high"]::after{
  background:var(--priority-high);
}

.priorityChoice[data-priority="medium"]::after{
  background:var(--priority-medium);
}

.priorityChoice[data-priority="low"]::after{
  background:var(--priority-low);
}

.task,
.generalTask{
  cursor:default;
}

/* GENERAL TO DO CALENDAR PICKER */

.calendarPickerOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:#514d4638;
  backdrop-filter:blur(3px);
  z-index:60;
  padding:24px;
}

.calendarPicker{
  width:min(420px,100%);
  margin:16vh auto 0;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:12px;
  padding:24px;
  box-shadow:0 18px 50px #0002;
}

.calendarPicker h3{
  margin:0 0 4px;
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  font-style:italic;
  font-weight:400;
}

.calendarPicker p{
  margin:0 0 18px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.calendarPicker input[type=date]{
  width:100%;
  border:1px solid var(--line);
  background:#fffdf8;
  color:var(--ink);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:16px;
}

.calendarPickerActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* DAILY NOTES OVERLAY */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#514d4638;
  backdrop-filter:blur(3px);
  padding:30px;
  z-index:50;
  overflow:auto;
}

.modal{
  max-width:760px;
  margin:30px auto;
  background:var(--paper);
  padding:30px;
  min-height:80vh;
  box-shadow:0 15px 50px #0002;
  position:relative;
}

.close{
  position:absolute;
  right:20px;
  top:18px;
  border:0;
  background:transparent;
  font-size:24px;
  cursor:pointer;
  color:var(--muted);
}

.modal h2{
  font-family:"Cormorant Garamond",serif;
  font-size:40px;
  font-style:italic;
  font-weight:400;
  margin:0;
}

.modal .date{
  margin:3px 0 22px;
}

.notes{
  width:100%;
  min-height:270px;
  border:0;
  outline:0;
  resize:vertical;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 30px,
    #e4dfd5 31px
  );
  line-height:31px;
  color:var(--ink);
}

.toolbar{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:15px;
}

/* SMALLER SCREENS */

@media(max-width:700px){
  .app{
    padding:15px;
  }

  .brand{
    font-size:32px;
  }

  .tabs{
    top:62px;
  }

  .monthTitle{
    top:102px;
    font-size:26px;
  }

  .card{
    scroll-margin-top:180px;
  }

  .generalHeader{
    align-items:flex-start;
    flex-direction:column;
  }

  .generalAdd{
    align-items:stretch;
    flex-direction:column;
  }

  .generalTask{
    grid-template-columns:auto 6px minmax(0,1fr) auto auto;
  }

  .generalTask select{
    grid-column:3 / 4;
    justify-self:start;
  }
}

/* FINAL COMPACT CONTEXT MENU OVERRIDE */
#taskContextMenu{
  display:none;
  position:fixed;
  width:190px !important;
  min-width:190px !important;
  max-width:190px !important;
  height:max-content !important;
  min-height:unset !important;
  max-height:max-content !important;
  padding:5px !important;
  margin:0 !important;
  overflow:hidden !important;
  align-self:auto !important;
  justify-self:auto !important;
  flex:none !important;
  grid-auto-rows:max-content !important;
}

#taskContextMenu.open{
  display:inline-block !important;
  height:max-content !important;
  min-height:0 !important;
  max-height:max-content !important;
}

#taskContextMenu #contextMenuActions{
  display:block !important;
  position:static !important;
  width:100% !important;
  height:max-content !important;
  min-height:0 !important;
  max-height:max-content !important;
  padding:0 !important;
  margin:0 !important;
  overflow:hidden !important;
}

#taskContextMenu .contextMenuTitle,
#taskContextMenu button,
#taskContextMenu .contextDivider,
#taskContextMenu .contextPriorityRow{
  position:static !important;
  float:none !important;
  flex:none !important;
}

#taskContextMenu .contextMenuTitle{
  height:auto !important;
  min-height:0 !important;
  max-height:none !important;
}

#taskContextMenu button{
  height:auto !important;
  min-height:0 !important;
  max-height:none !important;
}

#taskContextMenu .contextDivider{
  height:1px !important;
  min-height:1px !important;
  max-height:1px !important;
}


/* RESTORE PRIORITY COLOURS IN CONTEXT MENU */
#taskContextMenu .priorityChoice{
  position:relative !important;
  display:block !important;
  width:100% !important;
  height:20px !important;
  min-height:20px !important;
  padding:0 !important;
  border:1px solid var(--line) !important;
  border-radius:5px !important;
}

#taskContextMenu .priorityChoice::after{
  content:"";
  position:absolute !important;
  width:8px;
  height:8px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:var(--priority-none);
}

#taskContextMenu .priorityChoice[data-priority="high"]::after{
  background:var(--priority-high);
}

#taskContextMenu .priorityChoice[data-priority="medium"]::after{
  background:var(--priority-medium);
}

#taskContextMenu .priorityChoice[data-priority="low"]::after{
  background:var(--priority-low);
}

#taskContextMenu .priorityChoice[data-priority="none"]::after{
  background:var(--priority-none);
}

</style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <div class="brand">My Diary ✦</div>

    <div class="nav" id="diaryNav">
      <button onclick="changeMonth(-1)" aria-label="Previous month">‹</button>
      <button onclick="goToday()">Today</button>
      <button onclick="changeMonth(1)" aria-label="Next month">›</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tabButton active" id="diaryTabButton" onclick="switchTab('diary')">
      Diary
    </button>

    <button class="tabButton" id="generalTabButton" onclick="switchTab('general')">
      General To Do
    </button>
  </div>

  <!-- DIARY TAB -->

  <div class="tabPanel active" id="diaryPanel">

    <div class="settings">
      <button onclick="exportData()">Export backup</button>

      <button onclick="document.getElementById('importFile').click()">
        Import backup
      </button>

      <input
        id="importFile"
        type="file"
        accept=".json,application/json"
        onchange="importData(event)"
      >

      <span>Saved automatically on this device.</span>
    </div>

    <div class="monthTitle" id="monthTitle"></div>

    <div class="plannerScroll" id="plannerScroll">

      <div class="weekdays">
        <div class="weekday">Monday</div>
        <div class="weekday">Tuesday</div>
        <div class="weekday">Wednesday</div>
        <div class="weekday">Thursday</div>
        <div class="weekday">Friday</div>
      </div>

      <div class="grid" id="grid"></div>

    </div>

    <div class="footer">
      one day at a time · ✦
    </div>

  </div>

  <!-- GENERAL TO DO TAB -->

  <div class="tabPanel" id="generalPanel">

    <div class="generalWrap">

      <div class="generalHeader">
        <div>
          <h1 class="generalTitle">General to do</h1>
          <p class="generalIntro">
            A place for anything that needs doing, without giving it a date.
          </p>
        </div>
      </div>

      <div class="generalAdd">

        <textarea
          id="newGeneralTask"
          rows="1"
          placeholder="Add something to your list..."
          oninput="autoGrow(this)"
        ></textarea>

        <select class="prioritySelect" id="newGeneralPriority">
          <option value="none">No priority</option>
          <option value="high">High priority</option>
          <option value="medium">Medium priority</option>
          <option value="low">Low priority</option>
        </select>

        <button
          class="addGeneralButton"
          onclick="addGeneralTask()"
        >
          Add
        </button>

      </div>

      <div class="priorityLegend">
        <div class="legendItem">
          <span class="legendDot" style="background:var(--priority-high)"></span>
          High
        </div>
        <div class="legendItem">
          <span class="legendDot" style="background:var(--priority-medium)"></span>
          Medium
        </div>
        <div class="legendItem">
          <span class="legendDot" style="background:var(--priority-low)"></span>
          Low
        </div>
      </div>

      <div class="generalList" id="generalList"></div>

    </div>

  </div>

</div>




<div class="contextMenu" id="taskContextMenu">
  <div class="contextMenuTitle" id="contextMenuTitle">Task</div>
  <div id="contextMenuActions"></div>
</div>

<div class="calendarPickerOverlay" id="calendarPickerOverlay">
  <div class="calendarPicker">
    <h3>Add to calendar</h3>
    <p id="calendarPickerTask"></p>

    <input
      type="date"
      id="calendarPickerDate"
    >

    <div class="calendarPickerActions">
      <button onclick="closeGeneralCalendarPicker()">Cancel</button>
      <button onclick="confirmGeneralCalendarDate()">Add to Google Calendar</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">

  <div class="modal">

    <button
      class="close"
      onclick="closeModal()"
      aria-label="Close"
    >
      ×
    </button>

    <h2 id="modalDay"></h2>

    <div class="date" id="modalDate"></div>

    <div id="modalTasks"></div>

    <textarea
      class="notes"
      id="modalNotes"
      placeholder="Notes, thoughts, reminders..."
    ></textarea>

    <div class="toolbar">
      <button onclick="saveModal()">Save</button>
    </div>

  </div>

</div>


<script>

const KEY = "aestheticDiaryV2";
const GENERAL_KEY = "aestheticDiaryGeneralTodosV1";

let data =
  JSON.parse(
    localStorage.getItem(KEY) || "{}"
  );

let generalTodos =
  JSON.parse(
    localStorage.getItem(GENERAL_KEY) || "[]"
  );

const now = new Date();

let view =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    1
  );

let editingKey = null;
let activeTab = "diary";
let pendingGeneralCalendarTask = null;
let contextTask = null;
let longPressTimer = null;


const monthNames = [
  "January",
  "February",
  "March",
  "April",
  "May",
  "June",
  "July",
  "August",
  "September",
  "October",
  "November",
  "December"
];

const dayNames = [
  "Sunday",
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday"
];


function key(d){
  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}


function save(){
  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );
}


function saveGeneralTodos(){
  localStorage.setItem(
    GENERAL_KEY,
    JSON.stringify(generalTodos)
  );
}


function entry(d){
  const k = key(d);

  if(!data[k]){
    data[k] = {
      tasks:["","","","","",""],
      done:[false,false,false,false,false,false],
      notes:""
    };
  }

  while(data[k].done.length < data[k].tasks.length){
    data[k].done.push(false);
  }

  if(data[k].done.length > data[k].tasks.length){
    data[k].done = data[k].done.slice(0, data[k].tasks.length);
  }

  return data[k];
}


function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


function autoGrow(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}


/* TABS */

function switchTab(tab){

  activeTab = tab;

  const diaryActive =
    tab === "diary";

  document
    .getElementById("diaryPanel")
    .classList.toggle(
      "active",
      diaryActive
    );

  document
    .getElementById("generalPanel")
    .classList.toggle(
      "active",
      !diaryActive
    );

  document
    .getElementById("diaryTabButton")
    .classList.toggle(
      "active",
      diaryActive
    );

  document
    .getElementById("generalTabButton")
    .classList.toggle(
      "active",
      !diaryActive
    );

  document
    .getElementById("diaryNav")
    .style.visibility =
      diaryActive
      ? "visible"
      : "hidden";


  if(diaryActive){

    /*
      Whenever you return to Diary, reset to the current month
      and render again. render() already scrolls to today's card.
    */

    const today =
      new Date();

    view =
      new Date(
        today.getFullYear(),
        today.getMonth(),
        1
      );

    render();

  }
  else{

    renderGeneralTodos();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}



/* TASK CONTEXT MENU */

function closeTaskContextMenu(){

  document
    .getElementById("taskContextMenu")
    .classList.remove("open");

  contextTask = null;

}


function positionTaskContextMenu(x, y){

  const menu =
    document.getElementById(
      "taskContextMenu"
    );

  menu.style.height = "auto";
  menu.style.minHeight = "0";
  menu.style.maxHeight = "none";

  menu.classList.add(
    "open"
  );


  const rect =
    menu.getBoundingClientRect();

  const padding = 10;

  let left = x;
  let top = y;


  if(left + rect.width > window.innerWidth - padding){
    left = window.innerWidth - rect.width - padding;
  }

  if(top + rect.height > window.innerHeight - padding){
    top = window.innerHeight - rect.height - padding;
  }


  menu.style.left =
    Math.max(padding, left) + "px";

  menu.style.top =
    Math.max(padding, top) + "px";

}


function attachContextMenu(element, config){

  element.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

      openTaskContextMenu(
        event.clientX,
        event.clientY,
        config
      );

    }
  );


  element.addEventListener(
    "touchstart",
    event => {

      if(event.touches.length !== 1){
        return;
      }

      const touch =
        event.touches[0];


      longPressTimer =
        setTimeout(
          () => {

            openTaskContextMenu(
              touch.clientX,
              touch.clientY,
              config
            );

          },
          550
        );

    },
    {
      passive:true
    }
  );


  const cancelLongPress =
    () => {

      if(longPressTimer){
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }

    };


  element.addEventListener(
    "touchend",
    cancelLongPress
  );

  element.addEventListener(
    "touchmove",
    cancelLongPress
  );

  element.addEventListener(
    "touchcancel",
    cancelLongPress
  );

}


function openTaskContextMenu(x, y, config){

  contextTask =
    config;


  const title =
    document.getElementById(
      "contextMenuTitle"
    );


  const actions =
    document.getElementById(
      "contextMenuActions"
    );


  title.textContent =
    config.type === "general"
    ? "General to do"
    : "Diary task";


  actions.innerHTML = "";


  const completeButton =
    document.createElement(
      "button"
    );

  completeButton.textContent =
    config.isDone()
    ? "Mark as incomplete"
    : "Mark as complete";

  completeButton.onclick =
    () => {

      config.toggleComplete();

      closeTaskContextMenu();

    };

  actions.appendChild(
    completeButton
  );


  const calendarButton =
    document.createElement(
      "button"
    );

  calendarButton.textContent =
    "Add to Google Calendar";

  calendarButton.onclick =
    () => {

      closeTaskContextMenu();

      config.addToCalendar();

    };

  actions.appendChild(
    calendarButton
  );


  if(config.type === "general"){

    const divider =
      document.createElement(
        "div"
      );

    divider.className =
      "contextDivider";

    actions.appendChild(
      divider
    );


    const priorityLabel =
      document.createElement(
        "div"
      );

    priorityLabel.style.padding =
      "6px 10px 2px";

    priorityLabel.style.fontSize =
      "10px";

    priorityLabel.style.color =
      "var(--muted)";

    priorityLabel.style.textTransform =
      "uppercase";

    priorityLabel.style.letterSpacing =
      ".8px";

    priorityLabel.textContent =
      "Priority";

    actions.appendChild(
      priorityLabel
    );


    const priorityRow =
      document.createElement(
        "div"
      );

    priorityRow.className =
      "contextPriorityRow";


    [
      ["high","High"],
      ["medium","Medium"],
      ["low","Low"],
      ["none","None"]
    ].forEach(
      ([value,label]) => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "priorityChoice";

        button.dataset.priority =
          value;

        button.title =
          label + " priority";

        button.setAttribute(
          "aria-label",
          label + " priority"
        );


        button.onclick =
          () => {

            config.setPriority(
              value
            );

            closeTaskContextMenu();

          };


        priorityRow.appendChild(
          button
        );

      }
    );


    actions.appendChild(
      priorityRow
    );

  }


  const divider =
    document.createElement(
      "div"
    );

  divider.className =
    "contextDivider";

  actions.appendChild(
    divider
  );


  const deleteButton =
    document.createElement(
      "button"
    );

  deleteButton.className =
    "contextDelete";

  deleteButton.textContent =
    "Delete task";

  deleteButton.onclick =
    () => {

      config.deleteTask();

      closeTaskContextMenu();

    };


  actions.appendChild(
    deleteButton
  );


  positionTaskContextMenu(
    x,
    y
  );

}


/* Close the menu when clicking elsewhere or pressing Escape */

document.addEventListener(
  "pointerdown",
  event => {

    const menu =
      document.getElementById(
        "taskContextMenu"
      );

    if(
      menu.classList.contains("open")
      &&
      !menu.contains(event.target)
    ){
      closeTaskContextMenu();
    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){
      closeTaskContextMenu();
    }

  }
);


window.addEventListener(
  "scroll",
  closeTaskContextMenu,
  true
);



/* CREATE ONE DIARY TASK ROW */

function createTaskRow(e, i, onDelete, taskDate = null){

  const row =
    document.createElement("div");

  row.className =
    "task";


  row.innerHTML = `
    <input
      type="checkbox"
      ${e.done[i] ? "checked" : ""}
      aria-label="Mark task complete"
    >

    <textarea
      class="taskText"
      rows="1"
      placeholder="To do..."
      aria-label="Task"
    >${esc(e.tasks[i])}</textarea>

    ${
      taskDate
      ? `
        <button
          class="calendarTask"
          type="button"
          title="Add to Google Calendar"
          aria-label="Add to Google Calendar"
        ><span class="calendarIcon" aria-hidden="true"></span></button>
      `
      : ""
    }

    <button
      class="deleteTask"
      type="button"
      title="Delete task"
      aria-label="Delete task"
    >×</button>
  `;


  const cb =
    row.children[0];

  const tx =
    row.children[1];

  const calendarButton =
    taskDate
    ? row.children[2]
    : null;

  const del =
    taskDate
    ? row.children[3]
    : row.children[2];


  tx.value =
    e.tasks[i];


  cb.onchange =
    () => {

      e.done[i] =
        cb.checked;

      save();

    };


  tx.oninput =
    () => {

      e.tasks[i] =
        tx.value;

      autoGrow(tx);

      save();

    };


  if(calendarButton){

    calendarButton.onclick =
      () => {

        const taskText =
          tx.value.trim();

        if(!taskText){

          alert(
            "Add some text to the task before sending it to Google Calendar."
          );

          tx.focus();

          return;

        }

        openGoogleCalendarTask(
          taskDate,
          taskText
        );

      };

  }


  del.onclick =
    () => {

      e.tasks.splice(i, 1);
      e.done.splice(i, 1);

      save();

      onDelete();

    };


  attachContextMenu(
    row,
    {
      type:"diary",

      isDone:
        () => e.done[i],

      toggleComplete:
        () => {

          e.done[i] =
            !e.done[i];

          save();

          onDelete();

        },

      addToCalendar:
        () => {

          const taskText =
            e.tasks[i].trim();

          if(!taskText){

            alert(
              "Add some text to the task before sending it to Google Calendar."
            );

            return;

          }

          openGoogleCalendarTask(
            taskDate,
            taskText
          );

        },

      deleteTask:
        () => {

          e.tasks.splice(i, 1);
          e.done.splice(i, 1);

          save();

          onDelete();

        }
    }
  );


  requestAnimationFrame(
    () => autoGrow(tx)
  );


  return row;
}

/* BUILD DIARY MONTH */

function render(){

  document
    .getElementById("monthTitle")
    .textContent =
      monthNames[view.getMonth()]
      + " "
      + view.getFullYear();


  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";


  const y =
    view.getFullYear();

  const m =
    view.getMonth();

  const count =
    new Date(
      y,
      m + 1,
      0
    ).getDate();


  let workWeekRow = 1;
  let hasPlacedCard = false;


  for(
    let n = 1;
    n <= count;
    n++
  ){

    const d =
      new Date(
        y,
        m,
        n
      );


    if(
      d.getDay() === 0
      ||
      d.getDay() === 6
    ){
      continue;
    }


    if(
      d.getDay() === 1
      &&
      hasPlacedCard
    ){
      workWeekRow++;
    }


    const e =
      entry(d);


    const card =
      document.createElement(
        "section"
      );


    card.className =
      "card";


    card.style.gridColumn =
      String(d.getDay());

    card.style.gridRow =
      String(workWeekRow);


    if(workWeekRow % 3 === 0){
      card.classList.add("alt1");
    }
    else if(workWeekRow % 2 === 0){
      card.classList.add("alt2");
    }


    const today =
      new Date();


    if(
      d.getFullYear() === today.getFullYear()
      &&
      d.getMonth() === today.getMonth()
      &&
      d.getDate() === today.getDate()
    ){

      card.id =
        "today-card";

      card.classList.add(
        "today"
      );

    }


    card.innerHTML = `

      <div class="dayhead">

        <div class="day">
          ${dayNames[d.getDay()]}
        </div>

        <div class="date">
          ${String(n).padStart(2,"0")} ${monthNames[m]}
        </div>

      </div>

      <div class="tasks"></div>

      <button class="add">
        + add another
      </button>

      <button
        class="open"
        title="Open daily notes"
        aria-label="Open daily notes"
      >
        ↗
      </button>

    `;


    const tasks =
      card.querySelector(
        ".tasks"
      );


    function renderCardTasks(){

      tasks.innerHTML = "";

      e.tasks.forEach(
        (t,i) => {

          tasks.appendChild(
            createTaskRow(
              e,
              i,
              renderCardTasks,
              d
            )
          );

        }
      );

    }


    renderCardTasks();


    card
      .querySelector(".add")
      .onclick =
      () => {

        e.tasks.push("");
        e.done.push(false);

        save();

        renderCardTasks();

        requestAnimationFrame(
          () => {

            const fields =
              tasks.querySelectorAll(".taskText");

            if(fields.length){
              fields[fields.length - 1].focus();
            }

          }
        );

      };


    card
      .querySelector(".open")
      .onclick =
      () => openModal(d);


    grid.appendChild(
      card
    );


    hasPlacedCard = true;

  }


  const todayCard =
    document.getElementById(
      "today-card"
    );


  if(todayCard){

    setTimeout(
      () => {

        todayCard.scrollIntoView({
          behavior:"smooth",
          block:"start",
          inline:"center"
        });

      },
      120
    );

  }


  save();

}


/* GENERAL TO DO */

function addGeneralTask(){

  const field =
    document.getElementById(
      "newGeneralTask"
    );

  const priority =
    document.getElementById(
      "newGeneralPriority"
    ).value;


  const text =
    field.value.trim();


  if(!text){
    field.focus();
    return;
  }


  generalTodos.push({
    id:
      Date.now().toString()
      +
      "-"
      +
      Math.random().toString(16).slice(2),
    text:text,
    done:false,
    priority:priority
  });


  saveGeneralTodos();


  field.value = "";
  field.style.height = "auto";

  document
    .getElementById("newGeneralPriority")
    .value =
      "none";


  renderGeneralTodos();

  field.focus();

}


function renderGeneralTodos(){

  const list =
    document.getElementById(
      "generalList"
    );

  list.innerHTML = "";


  if(generalTodos.length === 0){

    const empty =
      document.createElement("div");

    empty.className =
      "emptyState";

    empty.textContent =
      "Nothing here yet — add anything you want to keep on your radar.";

    list.appendChild(
      empty
    );

    return;

  }


  const groups = [
    {
      key:"high",
      label:"High priority",
      colour:"var(--priority-high)"
    },
    {
      key:"medium",
      label:"Medium priority",
      colour:"var(--priority-medium)"
    },
    {
      key:"low",
      label:"Low priority",
      colour:"var(--priority-low)"
    },
    {
      key:"none",
      label:"No priority",
      colour:"var(--priority-none)"
    }
  ];


  function buildGeneralTaskRow(task){

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "generalTask priority-"
      +
      (task.priority || "none");


    if(task.done){
      row.classList.add(
        "completed"
      );
    }


    row.innerHTML = `

      <input
        type="checkbox"
        ${task.done ? "checked" : ""}
        aria-label="Mark task complete"
      >

      <div class="priorityBar"></div>

      <textarea
        rows="1"
        aria-label="General task"
      ></textarea>

      <select
        aria-label="Priority"
      >
        <option value="none">No priority</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>

      <button
        class="calendarTask"
        type="button"
        title="Add to Google Calendar"
        aria-label="Add to Google Calendar"
      >
        <span class="calendarIcon" aria-hidden="true"></span>
      </button>

      <button
        class="deleteTask"
        type="button"
        title="Delete task"
        aria-label="Delete task"
      >
        ×
      </button>

    `;


    const cb =
      row.children[0];

    const tx =
      row.children[2];

    const priority =
      row.children[3];

    const calendarButton =
      row.children[4];

    const del =
      row.children[5];


    tx.value =
      task.text;


    priority.value =
      task.priority || "none";


    cb.onchange =
      () => {

        task.done =
          cb.checked;

        saveGeneralTodos();

        renderGeneralTodos();

      };


    tx.oninput =
      () => {

        task.text =
          tx.value;

        autoGrow(tx);

        saveGeneralTodos();

      };


    priority.onchange =
      () => {

        task.priority =
          priority.value;

        saveGeneralTodos();

        renderGeneralTodos();

      };


    calendarButton.onclick =
      () => {

        openGeneralCalendarPicker(
          task
        );

      };


    del.onclick =
      () => {

        generalTodos =
          generalTodos.filter(
            item =>
              item.id !== task.id
          );

        saveGeneralTodos();

        renderGeneralTodos();

      };


    attachContextMenu(
      row,
      {
        type:"general",

        isDone:
          () => task.done,

        toggleComplete:
          () => {

            task.done =
              !task.done;

            saveGeneralTodos();

            renderGeneralTodos();

          },

        addToCalendar:
          () => {

            openGeneralCalendarPicker(
              task
            );

          },

        setPriority:
          value => {

            task.priority =
              value;

            saveGeneralTodos();

            renderGeneralTodos();

          },

        deleteTask:
          () => {

            generalTodos =
              generalTodos.filter(
                item =>
                  item.id !== task.id
              );

            saveGeneralTodos();

            renderGeneralTodos();

          }
      }
    );


    requestAnimationFrame(
      () => autoGrow(tx)
    );


    return row;

  }


  /*
    Active tasks are grouped by priority:
    High, Medium, Low, then No priority.
  */

  groups.forEach(
    group => {

      const tasksInGroup =
        generalTodos.filter(
          task =>
            !task.done
            &&
            (task.priority || "none") === group.key
        );


      if(tasksInGroup.length === 0){
        return;
      }


      const section =
        document.createElement(
          "section"
        );

      section.className =
        "priorityGroup";


      const heading =
        document.createElement(
          "h2"
        );

      heading.className =
        "priorityGroupHeader";

      heading.innerHTML = `
        <span
          class="priorityGroupDot"
          style="background:${group.colour}"
        ></span>

        ${group.label}

        <span class="priorityGroupCount">
          ${tasksInGroup.length}
          ${tasksInGroup.length === 1 ? "task" : "tasks"}
        </span>
      `;


      const groupList =
        document.createElement(
          "div"
        );

      groupList.className =
        "priorityGroupList";


      tasksInGroup.forEach(
        task => {

          groupList.appendChild(
            buildGeneralTaskRow(task)
          );

        }
      );


      section.appendChild(
        heading
      );

      section.appendChild(
        groupList
      );

      list.appendChild(
        section
      );

    }
  );


  /*
    Completed tasks stay together at the bottom,
    regardless of their former priority.
  */

  const completed =
    generalTodos.filter(
      task => task.done
    );


  if(completed.length){

    const section =
      document.createElement(
        "section"
      );

    section.className =
      "priorityGroup completedGroup";


    const heading =
      document.createElement(
        "h2"
      );

    heading.className =
      "priorityGroupHeader";

    heading.innerHTML = `
      <span
        class="priorityGroupDot"
        style="background:var(--sage)"
      ></span>

      Completed

      <span class="priorityGroupCount">
        ${completed.length}
        ${completed.length === 1 ? "task" : "tasks"}
      </span>
    `;


    const completedList =
      document.createElement(
        "div"
      );

    completedList.className =
      "priorityGroupList";


    completed.forEach(
      task => {

        completedList.appendChild(
          buildGeneralTaskRow(task)
        );

      }
    );


    section.appendChild(
      heading
    );

    section.appendChild(
      completedList
    );

    list.appendChild(
      section
    );

  }

}


/* GENERAL TO DO — CHOOSE A DATE BEFORE OPENING GOOGLE CALENDAR */

function openGeneralCalendarPicker(task){

  pendingGeneralCalendarTask =
    task;


  document
    .getElementById("calendarPickerTask")
    .textContent =
      task.text;


  const dateField =
    document.getElementById(
      "calendarPickerDate"
    );


  const today =
    new Date();


  dateField.value =
    [
      today.getFullYear(),
      String(today.getMonth() + 1).padStart(2,"0"),
      String(today.getDate()).padStart(2,"0")
    ].join("-");


  document
    .getElementById("calendarPickerOverlay")
    .style.display =
      "block";


  setTimeout(
    () => dateField.focus(),
    50
  );

}


function closeGeneralCalendarPicker(){

  document
    .getElementById("calendarPickerOverlay")
    .style.display =
      "none";


  pendingGeneralCalendarTask =
    null;

}


function confirmGeneralCalendarDate(){

  if(!pendingGeneralCalendarTask){
    return;
  }


  const value =
    document
      .getElementById("calendarPickerDate")
      .value;


  if(!value){

    alert(
      "Choose a date first."
    );

    return;

  }


  const parts =
    value.split("-").map(Number);


  const chosenDate =
    new Date(
      parts[0],
      parts[1] - 1,
      parts[2]
    );


  openGoogleCalendarTask(
    chosenDate,
    pendingGeneralCalendarTask.text
  );


  closeGeneralCalendarPicker();

}


/* GOOGLE CALENDAR — OPEN A PRE-FILLED ALL-DAY EVENT */

function calendarDateString(d){

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("");

}


function openGoogleCalendarTask(d, taskText){

  /*
    Google Calendar all-day links use an exclusive end date,
    so a one-day task runs from the selected date to the next day.
  */

  const nextDay =
    new Date(
      d.getFullYear(),
      d.getMonth(),
      d.getDate() + 1
    );


  const start =
    calendarDateString(d);

  const end =
    calendarDateString(nextDay);


  const params =
    new URLSearchParams({
      action:"TEMPLATE",
      text:taskText,
      dates:start + "/" + end,
      details:"Added from My Diary"
    });


  const url =
    "https://calendar.google.com/calendar/r/eventedit?"
    +
    params.toString();


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}

/* EXPORT BACKUP */

function exportData(){

  const backup = {
    diary:data,
    generalTodos:generalTodos,
    exportedAt:new Date().toISOString()
  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    URL.createObjectURL(
      blob
    );


  a.download =
    "my-diary-backup.json";


  a.click();


  setTimeout(
    () =>
      URL.revokeObjectURL(
        a.href
      ),
    500
  );

}


/* IMPORT BACKUP */

function importData(ev){

  const f =
    ev.target.files[0];


  if(!f){
    return;
  }


  const r =
    new FileReader();


  r.onload =
    () => {

      try{

        const parsed =
          JSON.parse(
            r.result
          );


        if(
          typeof parsed !== "object"
          ||
          Array.isArray(parsed)
        ){
          throw 0;
        }


        /*
          Supports both the older diary-only backups
          and the newer combined diary + General To Do backups.
        */

        if(
          parsed.diary
          &&
          typeof parsed.diary === "object"
        ){

          data =
            parsed.diary;

          generalTodos =
            Array.isArray(parsed.generalTodos)
            ? parsed.generalTodos
            : generalTodos;

        }
        else{

          data =
            parsed;

        }


        save();
        saveGeneralTodos();

        render();
        renderGeneralTodos();


        alert(
          "Diary backup imported."
        );

      }
      catch(e){

        alert(
          "That file doesn't look like a valid diary backup."
        );

      }

    };


  r.readAsText(
    f
  );


  ev.target.value =
    "";

}
