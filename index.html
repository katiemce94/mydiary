<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf8f2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>My Diary</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500&display=swap');
:root{--paper:#faf8f2;--ink:#514d46;--muted:#9a9388;--line:#ded8cc;--sage:#aeb7a5}
*{box-sizing:border-box}
body{margin:0;background:#e7e2d9;color:var(--ink);font-family:"DM Sans",sans-serif}
button,input,textarea{font:inherit}
.app{max-width:1180px;margin:auto;padding:28px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-family:"Cormorant Garamond",serif;font-size:42px;font-style:italic}
.nav{display:flex;gap:8px;align-items:center}
button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 13px;border-radius:8px;cursor:pointer}
button:hover{background:white}
.monthTitle{text-align:center;font-family:"Cormorant Garamond",serif;font-size:30px;margin:8px 0 22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--paper);border:1px solid var(--line);padding:18px;min-height:235px;position:relative;box-shadow:0 2px 8px #00000008}
.card:nth-child(3n){background:#f6f4ed}.card:nth-child(4n){background:#f1f4ed}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px}
.day{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:25px}
.date{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted)}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:flex;gap:9px;align-items:center}
.task input[type=checkbox]{appearance:none;width:16px;height:16px;border:1px solid #aaa398;background:transparent;border-radius:2px;cursor:pointer;flex:none}
.task input:checked{background:var(--sage);border-color:var(--sage)}
.task input:checked::after{content:"✓";display:block;text-align:center;font-size:11px;color:white;line-height:15px}
.task input:checked + input{text-decoration:line-through;color:var(--muted)}
.task input[type=text]{border:0;border-bottom:1px solid #ded8cc;background:transparent;outline:0;width:100%;padding:3px 0;color:var(--ink)}
.add{margin-top:12px;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:12px}
.open{position:absolute;right:12px;bottom:10px;border:0;background:transparent;color:#aaa398;cursor:pointer}
.footer{text-align:center;color:var(--muted);font-size:11px;letter-spacing:1px;margin:20px}
.overlay{display:none;position:fixed;inset:0;background:#514d4638;backdrop-filter:blur(3px);padding:30px;z-index:10;overflow:auto}
.modal{max-width:760px;margin:30px auto;background:var(--paper);padding:30px;min-height:80vh;box-shadow:0 15px 50px #0002;position:relative}
.close{position:absolute;right:20px;top:18px;border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--muted)}
.modal h2{font-family:"Cormorant Garamond",serif;font-size:40px;font-style:italic;font-weight:400;margin:0}
.modal .date{margin:3px 0 22px}
.notes{width:100%;min-height:270px;border:0;outline:0;resize:vertical;background:repeating-linear-gradient(to bottom,transparent 0,transparent 30px,#e4dfd5 31px);line-height:31px;color:var(--ink)}
.toolbar{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
.settings{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.settings span{font-size:12px;color:var(--muted)}
#importFile{display:none}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.app{padding:15px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.brand{font-size:32px}.monthTitle{font-size:26px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">my diary ✦</div>
    <div class="nav">
      <button onclick="changeMonth(-1)">‹</button>
      <button onclick="goToday()">Today</button>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="settings">
    <button onclick="exportData()">Export backup</button>
    <button onclick="document.getElementById('importFile').click()">Import backup</button>
    <input id="importFile" type="file" accept=".json,application/json" onchange="importData(event)">
    <span>Saved automatically on this device.</span>
  </div>
  <div class="monthTitle" id="monthTitle"></div>
  <div class="grid" id="grid"></div>
  <div class="footer">one day at a time · ✦</div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" onclick="closeModal()">×</button>
    <h2 id="modalDay"></h2>
    <div class="date" id="modalDate"></div>
    <div id="modalTasks"></div>
    <textarea class="notes" id="modalNotes" placeholder="Notes, thoughts, reminders..."></textarea>
    <div class="toolbar"><button onclick="saveModal()">Save</button></div>
  </div>
</div>
<script>
const KEY="aestheticDiaryV2";
let data=JSON.parse(localStorage.getItem(KEY)||"{}");
let now=new Date(), view=new Date(now.getFullYear(),now.getMonth(),1), editingKey=null;
const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
const dayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function key(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function entry(d){let k=key(d);if(!data[k])data[k]={tasks:["","","","","",""],done:[false,false,false,false,false,false],notes:""};return data[k]}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(){
 document.getElementById("monthTitle").textContent=monthNames[view.getMonth()]+" "+view.getFullYear();
 const grid=document.getElementById("grid");grid.innerHTML="";
 let y=view.getFullYear(),m=view.getMonth(),count=new Date(y,m+1,0).getDate();
for(let n=1;n<=count;n++){
  let d=new Date(y,m,n);

  // Work diary — hide Saturday and Sunday
  if(d.getDay() === 0 || d.getDay() === 6) continue;

  let e=entry(d),card=document.createElement("section");card.className="card";
  card.innerHTML=`<div class="dayhead"><div class="day">${dayNames[d.getDay()]}</div><div class="date">${String(n).padStart(2,"0")} ${monthNames[m]}</div></div><div class="tasks"></div><button class="add">+ add another</button><button class="open" title="Open daily notes">↗</button>`;
  let tasks=card.querySelector(".tasks");
  e.tasks.forEach((t,i)=>{let row=document.createElement("div");row.className="task";row.innerHTML=`<input type="checkbox" ${e.done[i]?"checked":""}><input type="text" value="${esc(t)}" placeholder="To do...">`;let cb=row.children[0],tx=row.children[1];cb.onchange=()=>{e.done[i]=cb.checked;save()};tx.oninput=()=>{e.tasks[i]=tx.value;save()};tasks.appendChild(row)});
  card.querySelector(".add").onclick=()=>{e.tasks.push("");e.done.push(false);save();render()};
  card.querySelector(".open").onclick=()=>openModal(d);grid.appendChild(card);
 } save();
}
function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
function goToday(){let t=new Date();view=new Date(t.getFullYear(),t.getMonth(),1);render()}
function openModal(d){
 editingKey=key(d);let e=entry(d);document.getElementById("modalDay").textContent=dayNames[d.getDay()];
 document.getElementById("modalDate").textContent=d.toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"});
 let box=document.getElementById("modalTasks");box.innerHTML="";
 e.tasks.forEach((t,i)=>{let row=document.createElement("div");row.className="task";row.style.marginBottom="12px";row.innerHTML=`<input type="checkbox" ${e.done[i]?"checked":""}><input type="text" value="${esc(t)}" placeholder="To do...">`;row.children[0].onchange=()=>e.done[i]=row.children[0].checked;row.children[1].oninput=()=>e.tasks[i]=row.children[1].value;box.appendChild(row)});
 document.getElementById("modalNotes").value=e.notes||"";document.getElementById("overlay").style.display="block";
}
function saveModal(){data[editingKey].notes=document.getElementById("modalNotes").value;save();closeModal();render()}
function closeModal(){document.getElementById("overlay").style.display="none"}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my-diary-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result);if(typeof parsed!=="object"||Array.isArray(parsed))throw 0;data=parsed;save();render();alert("Diary backup imported.");}catch(e){alert("That file doesn't look like a valid diary backup.");}};r.readAsText(f);ev.target.value=""}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {
      updateViaCache: "none"
    });
  });
}
render();
</script>
</body>
</html>
